<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin — Kerry Care</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy:  #1a3060;
      --gold:  #c8a050;
      --blush: #e8b4b8;
      --dark:  #0d0d0d;
      --gray:  #666;
      --light: #f9f6f2;
      --white: #ffffff;
      --red:   #d94f4f;
      --green: #3aaa6e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Quicksand', sans-serif; background: var(--light); color: var(--dark); min-height: 100vh; }

    /* ── LOGIN ── */
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--navy);
    }
    .login-card {
      background: var(--white); border-radius: 16px; padding: 48px 40px;
      width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.25); text-align: center;
    }
    .login-logo { font-family: 'Inconsolata', monospace; font-size: 1.4rem; color: var(--navy); font-weight: 700; letter-spacing: .04em; }
    .login-sub  { font-size: .8rem; color: var(--gold); letter-spacing: .12em; text-transform: uppercase; margin-top: 4px; }
    .login-divider { height: 1px; background: var(--blush); margin: 24px 0; }
    .login-card label { display: block; text-align: left; font-size: .8rem; font-weight: 600; color: var(--gray); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .06em; }
    .login-card input {
      width: 100%; padding: 12px 14px; border: 1.5px solid #ddd; border-radius: 8px;
      font-family: 'Quicksand', sans-serif; font-size: .95rem; margin-bottom: 16px;
      outline: none; transition: border .2s;
    }
    .login-card input:focus { border-color: var(--navy); }
    .btn-login {
      width: 100%; padding: 13px; background: var(--navy); color: var(--white);
      border: none; border-radius: 8px; font-family: 'Inconsolata', monospace;
      font-size: 1rem; font-weight: 700; letter-spacing: .06em; cursor: pointer; transition: background .2s;
    }
    .btn-login:hover { background: #24408a; }
    .login-error { color: var(--red); font-size: .85rem; margin-top: 12px; display: none; }

    /* ── DASHBOARD ── */
    .dashboard { display: none; }
    .top-bar {
      background: var(--navy); color: var(--white);
      padding: 16px 32px; display: flex; align-items: center; justify-content: space-between;
    }
    .top-bar-brand { font-family: 'Inconsolata', monospace; font-size: 1.1rem; font-weight: 700; letter-spacing: .04em; }
    .top-bar-sub   { font-size: .75rem; color: var(--gold); letter-spacing: .1em; }
    .btn-logout {
      background: transparent; border: 1.5px solid rgba(255,255,255,.4); color: var(--white);
      border-radius: 6px; padding: 7px 16px; font-family: 'Quicksand', sans-serif;
      font-size: .85rem; cursor: pointer; transition: all .2s;
    }
    .btn-logout:hover { background: rgba(255,255,255,.1); }

    .dash-body { padding: 32px; max-width: 1100px; margin: 0 auto; }

    .filtros { display: flex; gap: 10px; margin-bottom: 28px; flex-wrap: wrap; align-items: center; }
    .filtro-label { font-size: .8rem; color: var(--gray); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
    .btn-filtro {
      padding: 8px 18px; border-radius: 20px; border: 1.5px solid #ddd; background: var(--white);
      font-family: 'Quicksand', sans-serif; font-size: .85rem; cursor: pointer; transition: all .2s; font-weight: 500;
    }
    .btn-filtro.active, .btn-filtro:hover { background: var(--navy); color: var(--white); border-color: var(--navy); }

    .stats { display: flex; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
    .stat-card {
      background: var(--white); border-radius: 12px; padding: 20px 24px;
      flex: 1; min-width: 140px; box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .stat-num   { font-family: 'Inconsolata', monospace; font-size: 2rem; font-weight: 700; color: var(--navy); }
    .stat-label { font-size: .8rem; color: var(--gray); margin-top: 4px; }

    .tabla-wrap { background: var(--white); border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.07); overflow: hidden; }
    .tabla-titulo { padding: 20px 24px; border-bottom: 1px solid #f0ece8; font-family: 'Inconsolata', monospace; font-size: 1rem; font-weight: 700; color: var(--navy); }

    table { width: 100%; border-collapse: collapse; }
    th {
      padding: 12px 16px; text-align: left; font-size: .75rem; text-transform: uppercase;
      letter-spacing: .08em; color: var(--gray); background: #faf8f5;
      border-bottom: 1px solid #ede9e4; font-family: 'Inconsolata', monospace; font-weight: 600;
    }
    td { padding: 14px 16px; border-bottom: 1px solid #f5f2ee; font-size: .9rem; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fdf9f5; }

    .badge-fecha { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: .78rem; font-family: 'Inconsolata', monospace; font-weight: 600; }
    .badge-hoy    { background: #fff3cd; color: #856404; }
    .badge-manana { background: #d1ecf1; color: #0c5460; }
    .badge-otro   { background: #f0ece8; color: var(--gray); }

    .badge-rec { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: .75rem; font-weight: 600; }
    .badge-enviado   { background: #d4edda; color: #155724; }
    .badge-pendiente { background: #f8d7da; color: #721c24; }

    .btn-wa {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px;
      background: #25D366; color: var(--white); text-decoration: none; font-size: .82rem;
      font-weight: 600; transition: background .2s; white-space: nowrap;
    }
    .btn-wa:hover { background: #1ebe5b; }
    .btn-wa svg { width: 14px; height: 14px; fill: white; flex-shrink: 0; }

    .btn-del {
      display: inline-flex; align-items: center; gap: 5px; padding: 7px 12px; border-radius: 8px;
      background: #fff0f0; color: #c0392b; border: 1px solid #f5c6cb; font-size: .82rem;
      font-weight: 600; cursor: pointer; transition: background .2s; white-space: nowrap;
    }
    .btn-del:hover { background: #ffd5d5; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--gray); }
    .empty-state span { font-size: 2.5rem; display: block; margin-bottom: 12px; }
    .loading { text-align: center; padding: 60px 20px; color: var(--gray); font-size: .9rem; }

    /* ── VIEW TOGGLE ── */
    .view-toggle {
      display: flex; gap: 6px; background: #f0ece8; border-radius: 10px; padding: 4px;
    }
    .btn-view {
      padding: 7px 18px; border-radius: 7px; border: none; background: transparent;
      font-family: 'Quicksand', sans-serif; font-size: .85rem; font-weight: 600;
      cursor: pointer; color: var(--gray); transition: all .18s;
    }
    .btn-view.active { background: var(--white); color: var(--navy); box-shadow: 0 1px 4px rgba(0,0,0,.1); }

    /* ── CALENDARIO: MES ── */
    .cal-mes-wrap { background: var(--white); border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.07); overflow: hidden; display: none; }
    .cal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px; border-bottom: 1px solid #f0ece8;
    }
    .cal-titulo { font-family: 'Inconsolata', monospace; font-size: 1rem; font-weight: 700; color: var(--navy); text-transform: capitalize; }
    .btn-cal-nav {
      background: none; border: 1.5px solid #ddd; border-radius: 8px;
      width: 34px; height: 34px; cursor: pointer; font-size: 1rem; color: var(--navy);
      display: flex; align-items: center; justify-content: center; transition: all .18s;
    }
    .btn-cal-nav:hover { background: var(--navy); color: var(--white); border-color: var(--navy); }
    .cal-grid-header {
      display: grid; grid-template-columns: repeat(7, 1fr);
      background: #faf8f5; border-bottom: 1px solid #ede9e4;
    }
    .cal-dow {
      padding: 10px 0; text-align: center; font-size: .72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em; color: var(--gray);
      font-family: 'Inconsolata', monospace;
    }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .cal-cell {
      min-height: 80px; padding: 8px; border-right: 1px solid #f5f2ee;
      border-bottom: 1px solid #f5f2ee; cursor: pointer; transition: background .15s; position: relative;
    }
    .cal-cell:nth-child(7n) { border-right: none; }
    .cal-cell:hover { background: #fdf9f5; }
    .cal-cell.otro-mes { opacity: .35; pointer-events: none; }
    .cal-cell.hoy .cal-day-num {
      background: var(--navy); color: var(--white); border-radius: 50%;
      width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    }
    .cal-day-num { font-family: 'Inconsolata', monospace; font-size: .88rem; font-weight: 700; color: var(--dark); margin-bottom: 4px; }
    .cal-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--gold); margin: 1px;
    }
    .cal-cita-chip {
      display: block; font-size: .68rem; padding: 2px 6px; border-radius: 4px;
      background: #e8f4fd; color: #0c5460; margin-top: 2px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; font-weight: 600;
    }
    .cal-cell.tiene-citas { background: #fffdf5; }

    /* ── CALENDARIO: SEMANA ── */
    .cal-semana-wrap { background: var(--white); border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.07); overflow: hidden; display: none; }
    .cal-semana-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      border-top: 1px solid #f0ece8;
    }
    .cal-semana-col { border-right: 1px solid #f5f2ee; min-height: 300px; }
    .cal-semana-col:last-child { border-right: none; }
    .cal-semana-col-header {
      padding: 12px 8px; text-align: center; background: #faf8f5;
      border-bottom: 1px solid #ede9e4;
    }
    .cal-semana-dow { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--gray); font-family: 'Inconsolata', monospace; }
    .cal-semana-date {
      font-family: 'Inconsolata', monospace; font-size: 1.1rem; font-weight: 700;
      color: var(--dark); margin-top: 2px;
    }
    .cal-semana-date.hoy-date {
      background: var(--navy); color: var(--white); border-radius: 50%;
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      margin: 4px auto 0;
    }
    .cal-semana-citas { padding: 8px; }
    .cal-semana-cita {
      background: #f0f5ff; border-left: 3px solid var(--navy);
      border-radius: 0 6px 6px 0; padding: 6px 8px; margin-bottom: 6px; cursor: pointer;
    }
    .cal-semana-cita:hover { background: #e0ebff; }
    .cal-semana-cita-hora { font-family: 'Inconsolata', monospace; font-size: .72rem; color: var(--navy); font-weight: 700; }
    .cal-semana-cita-nombre { font-size: .8rem; font-weight: 600; color: var(--dark); }
    .cal-semana-cita-svc { font-size: .72rem; color: var(--gray); }
    .cal-semana-empty { padding: 20px 8px; text-align: center; color: #ccc; font-size: .8rem; }

    /* ── MODAL DE DÍA ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000;
      display: none; align-items: center; justify-content: center; padding: 24px;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      background: var(--white); border-radius: 16px; padding: 32px;
      max-width: 480px; width: 100%; max-height: 80vh; overflow-y: auto;
      box-shadow: 0 24px 60px rgba(0,0,0,.25);
    }
    .modal-titulo { font-family: 'Inconsolata', monospace; font-size: 1rem; font-weight: 700; color: var(--navy); margin-bottom: 20px; text-transform: capitalize; }
    .modal-cita {
      border: 1px solid #ede9e4; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px;
    }
    .modal-cita-hora { font-family: 'Inconsolata', monospace; font-size: .8rem; font-weight: 700; color: var(--gold); }
    .modal-cita-nombre { font-size: .95rem; font-weight: 700; color: var(--dark); margin: 2px 0; }
    .modal-cita-svc { font-size: .83rem; color: var(--gray); }
    .modal-cita-tel { font-size: .8rem; color: var(--gray); margin-top: 6px; }
    .modal-close {
      width: 100%; padding: 11px; background: var(--navy); color: var(--white);
      border: none; border-radius: 8px; font-family: 'Inconsolata', monospace;
      font-size: .9rem; font-weight: 700; cursor: pointer; margin-top: 8px; transition: background .2s;
    }
    .modal-close:hover { background: #24408a; }

    /* ── DISPONIBILIDAD ── */
    .horario-row {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      padding: 14px 24px; border-bottom: 1px solid #f5f2ee;
    }
    .horario-row:last-child { border-bottom: none; }
    .horario-dia { font-weight: 700; width: 100px; font-size: .9rem; color: var(--dark); }
    .horario-toggle {
      position: relative; width: 42px; height: 24px; -webkit-appearance: none;
      appearance: none; background: #ddd; border-radius: 12px; cursor: pointer;
      transition: background .2s; flex-shrink: 0; border: none; outline: none;
    }
    .horario-toggle:checked { background: var(--green); }
    .horario-toggle::after {
      content: ''; position: absolute; top: 4px; left: 4px;
      width: 16px; height: 16px; border-radius: 50%; background: white;
      transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25);
    }
    .horario-toggle:checked::after { left: 22px; }
    .horario-estado { font-size: .8rem; color: var(--gray); width: 54px; }
    .horario-time {
      padding: 7px 10px; border: 1.5px solid #ddd; border-radius: 8px;
      font-family: 'Inconsolata', monospace; font-size: .88rem;
      color: var(--dark); outline: none; transition: border .2s;
    }
    .horario-time:disabled { opacity: .3; background: #f5f2ee; cursor: not-allowed; }
    .horario-time:focus { border-color: var(--navy); }
    .horario-time-label { font-size: .78rem; color: var(--gray); }
    .btn-horario-save {
      padding: 10px 24px; background: var(--navy); color: white;
      border: none; border-radius: 8px; font-family: 'Inconsolata', monospace;
      font-size: .9rem; font-weight: 700; cursor: pointer; transition: background .2s;
    }
    .btn-horario-save:hover { background: #24408a; }
    .btn-horario-save:disabled { opacity: .6; cursor: not-allowed; }
    .save-msg { margin-left: 14px; font-size: .85rem; color: var(--green); font-weight: 600; }
    .bloqueo-form {
      display: flex; gap: 10px; padding: 16px 24px; align-items: flex-end; flex-wrap: wrap;
      border-top: 1px solid #f0ece8;
    }
    .bloqueo-form label { display: block; font-size: .75rem; color: var(--gray); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; }
    .bloqueo-form input[type="date"],
    .bloqueo-form input[type="text"] {
      padding: 8px 12px; border: 1.5px solid #ddd; border-radius: 8px;
      font-family: 'Quicksand', sans-serif; font-size: .9rem; outline: none; transition: border .2s;
    }
    .bloqueo-form input[type="text"] { flex: 1; min-width: 160px; }
    .bloqueo-form input:focus { border-color: var(--navy); }
    #btn-add-bloqueo {
      padding: 9px 20px; background: var(--navy); color: white; border: none;
      border-radius: 8px; font-family: 'Quicksand', sans-serif; font-weight: 600;
      cursor: pointer; white-space: nowrap; font-size: .88rem;
    }
    #btn-add-bloqueo:hover { background: #24408a; }
    .bloqueo-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px; border-bottom: 1px solid #f5f2ee;
    }
    .bloqueo-item:last-child { border-bottom: none; }
    .bloqueo-fecha { font-family: 'Inconsolata', monospace; font-weight: 700; color: var(--navy); font-size: .9rem; }
    .bloqueo-motivo { font-size: .83rem; color: var(--gray); margin-left: 12px; }
    .btn-rm-bloqueo {
      background: #fff0f0; color: #c0392b; border: 1px solid #f5c6cb;
      border-radius: 6px; padding: 5px 10px; font-size: .78rem; cursor: pointer; font-weight: 600; transition: background .2s;
    }
    .btn-rm-bloqueo:hover { background: #ffd5d5; }
    .disp-empty { padding: 16px 24px; color: var(--gray); font-size: .88rem; }

    @media (max-width: 700px) {
      .top-bar, .dash-body { padding: 14px 16px; }

      /* Ocultar columnas menos importantes en móvil */
      th:nth-child(5), td:nth-child(5),
      th:nth-child(6), td:nth-child(6) { display: none; }

      /* Tabla con scroll horizontal */
      .tabla-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      table { min-width: 480px; }

      /* Botones más compactos */
      .btn-wa { padding: 6px 10px; font-size: .78rem; }
      .btn-del { padding: 6px 8px; font-size: .78rem; }
      td { padding: 10px 10px; font-size: .82rem; }
      th { padding: 10px 10px; }

      /* Stats en columna */
      .stats-grid { grid-template-columns: 1fr 1fr; }

      /* Filtros wrap */
      .filtros { flex-wrap: wrap; gap: 8px; }
    }
  </style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <div class="login-logo">Kerry Care</div>
    <div class="login-sub">Beauty Studio · Admin</div>
    <div class="login-divider"></div>
    <label for="inp-email">Correo</label>
    <input type="email" id="inp-email" placeholder="tu@correo.com" autocomplete="email" />
    <label for="inp-pass">Contraseña</label>
    <input type="password" id="inp-pass" placeholder="••••••••" autocomplete="current-password" />
    <button class="btn-login" id="btn-login">Entrar</button>
    <div class="login-error" id="login-error">Correo o contraseña incorrectos.</div>
  </div>
</div>

<!-- ══ DASHBOARD ══ -->
<div class="dashboard" id="dashboard">
  <div class="top-bar">
    <div>
      <div class="top-bar-brand">Kerry Care · Panel</div>
      <div class="top-bar-sub">Gestión de citas</div>
    </div>
    <button class="btn-logout" id="btn-logout">Cerrar sesión</button>
  </div>
  <div class="dash-body">

    <!-- Controles superiores: filtros + toggle vista -->
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:28px;">
      <div class="filtros" style="margin-bottom:0;" id="filtros-lista">
        <span class="filtro-label">Ver:</span>
        <button class="btn-filtro active" data-rango="hoy">Hoy</button>
        <button class="btn-filtro" data-rango="semana">Esta semana</button>
        <button class="btn-filtro" data-rango="todas">Próximas (3 meses)</button>
      </div>
      <div class="view-toggle">
        <button class="btn-view active" id="btn-vista-lista">☰ Lista</button>
        <button class="btn-view" id="btn-vista-cal-mes">📅 Mes</button>
        <button class="btn-view" id="btn-vista-cal-sem">🗓 Semana</button>
        <button class="btn-view" id="btn-vista-horario">📋 Horario</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card"><div class="stat-num" id="stat-total">—</div><div class="stat-label">Citas en el período</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-hoy">—</div><div class="stat-label">Citas hoy</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-pendientes">—</div><div class="stat-label">Sin recordatorio enviado</div></div>
    </div>

    <!-- Vista Lista -->
    <div id="vista-lista">
      <div class="tabla-wrap">
        <div class="tabla-titulo">Citas agendadas</div>
        <div id="tabla-contenido"><div class="loading">Cargando citas…</div></div>
      </div>
    </div>

    <!-- Vista Calendario Mes -->
    <div class="cal-mes-wrap" id="vista-cal-mes">
      <div class="cal-header">
        <button class="btn-cal-nav" id="cal-mes-prev">‹</button>
        <div class="cal-titulo" id="cal-mes-titulo">—</div>
        <button class="btn-cal-nav" id="cal-mes-next">›</button>
      </div>
      <div class="cal-grid-header">
        <div class="cal-dow">Dom</div><div class="cal-dow">Lun</div><div class="cal-dow">Mar</div>
        <div class="cal-dow">Mié</div><div class="cal-dow">Jue</div><div class="cal-dow">Vie</div>
        <div class="cal-dow">Sáb</div>
      </div>
      <div class="cal-grid" id="cal-mes-grid"></div>
    </div>

    <!-- Vista Calendario Semana -->
    <div class="cal-semana-wrap" id="vista-cal-semana">
      <div class="cal-header">
        <button class="btn-cal-nav" id="cal-sem-prev">‹</button>
        <div class="cal-titulo" id="cal-sem-titulo">—</div>
        <button class="btn-cal-nav" id="cal-sem-next">›</button>
      </div>
      <div class="cal-semana-grid" id="cal-sem-grid"></div>
    </div>

    <!-- Vista Disponibilidad / Horario -->
    <div id="vista-horario" style="display:none;">

      <div class="tabla-wrap" style="margin-bottom:20px;">
        <div class="tabla-titulo">Horario Semanal</div>

        <div style="padding:16px 24px;display:flex;align-items:center;">
          <button class="btn-horario-save" id="btn-save-horario">💾 Guardar cambios</button>
          <span class="save-msg" id="save-msg"></span>

      </div>

      <div class="tabla-wrap">
        <div class="tabla-titulo">Días Bloqueados</div>

        <div class="bloqueo-form">
          <div>
            <label>Fecha a bloquear</label>

</div>

<!-- Supabase JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  // ── Inicializar Supabase (anon key — clave pública, OK estar aquí) ──
  const { createClient } = supabase;
  const sb = createClient(
    'https://qxwswmkimbvyqhhmmzmh.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4d3N3bWtpbWJ2eXFoaG1tem1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MjAzNTMsImV4cCI6MjA5MzM5NjM1M30.7UFoTOKjfVdRlU6udhLpIRzMT2hULjcTUai6I53Ss9M'
  );

  const TODAY      = new Date().toISOString().split('T')[0];
  const loginWrap  = document.getElementById('login-wrap');
  const dashboard  = document.getElementById('dashboard');
  const loginError = document.getElementById('login-error');
  const btnLogin   = document.getElementById('btn-login');
  let   token      = '';

  // ── Revisar sesión existente al cargar ──
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session?.access_token) {
      token = session.access_token;
      mostrarDashboard();
    }
  })();

  // ── Login ──
  btnLogin.addEventListener('click', async () => {
    const email = document.getElementById('inp-email').value.trim();
    const pass  = document.getElementById('inp-pass').value;
    loginError.style.display = 'none';
    btnLogin.textContent = 'Verificando…';
    btnLogin.disabled    = true;

    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });

    if (error || !data.session) {
      loginError.style.display = 'block';
      btnLogin.textContent = 'Entrar';
      btnLogin.disabled    = false;
      return;
    }

    token = data.session.access_token;
    mostrarDashboard();
  });

  // Enter en inputs
  ['inp-email','inp-pass'].forEach(id =>
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') btnLogin.click();
    })
  );

  // ── Logout ──
  document.getElementById('btn-logout').addEventListener('click', async () => {
    await sb.auth.signOut();
    token = '';
    dashboard.style.display = 'none';
    loginWrap.style.display = 'flex';
  });

  function mostrarDashboard() {
    loginWrap.style.display = 'none';
    dashboard.style.display = 'block';
    cargarCitas('hoy');
  }

  // ── Filtros ──
  let rangoActual = 'hoy';
  document.querySelectorAll('.btn-filtro').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      rangoActual = btn.dataset.rango;
      cargarCitas(rangoActual);
    });
  });

  // ── Sanitizar output (prevenir XSS) ──
  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // ── Cargar citas desde Netlify function ──
  async function cargarCitas(rango) {
    document.getElementById('tabla-contenido').innerHTML = '<div class="loading">Cargando citas…</div>';
    try {
      const r = await fetch(`/api/admin-citas?rango=${rango}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (r.status === 401) { await sb.auth.signOut(); location.reload(); return; }
      const data = await r.json();
      renderTabla(data.citas || []);
    } catch {
      document.getElementById('tabla-contenido').innerHTML =
        '<div class="loading">Error al cargar. Recarga la página.</div>';
    }
  }

  // ── Render tabla ──
  function renderTabla(citas) {
    const hoy = citas.filter(c => c.fecha === TODAY).length;
    const sin = citas.filter(c => !c.recordatorio_enviado).length;
    document.getElementById('stat-total').textContent      = citas.length;
    document.getElementById('stat-hoy').textContent        = hoy;
    document.getElementById('stat-pendientes').textContent = sin;

    if (!citas.length) {
      document.getElementById('tabla-contenido').innerHTML =
        '<div class="empty-state"><span>📅</span>No hay citas en este período.</div>';
      return;
    }

    const manana = (() => {
      const d = new Date(); d.setDate(d.getDate() + 1);
      return d.toISOString().split('T')[0];
    })();

    const filas = citas.map(c => {
      const fechaFmt  = new Date(`${c.fecha}T12:00:00`).toLocaleDateString('es-CR', {
        weekday: 'short', day: 'numeric', month: 'short'
      });
      const badgeClass = c.fecha === TODAY   ? 'badge-hoy'    :
                         c.fecha === manana  ? 'badge-manana' : 'badge-otro';
      const badgeLabel = c.fecha === TODAY   ? '⚡ Hoy'       :
                         c.fecha === manana  ? '🌙 Mañana'   : fechaFmt;

      const telWA  = c.telefono.startsWith('506') ? c.telefono : `506${c.telefono}`;
      const telVis = c.telefono.startsWith('506') ? c.telefono.slice(3) : c.telefono;
      const hora12 = formatHora(c.hora);

      const msgWA = encodeURIComponent(
        `Hola ${c.nombre} es para confirmar tu cita de ${c.servicio} a las ${hora12}.`
      );
      const urlWA = `whatsapp://send?phone=${telWA}&text=${msgWA}`;

      const badgeRec = c.recordatorio_enviado
        ? '<span class="badge-rec badge-enviado">✓ Enviado</span>'
        : '<span class="badge-rec badge-pendiente">Pendiente</span>';

      return `
        <tr>
          <td><strong>${esc(c.nombre)}</strong></td>
          <td>${esc(c.servicio)}</td>
          <td><span class="badge-fecha ${badgeClass}">${badgeLabel}</span></td>
          <td>${esc(hora12)}</td>
          <td>${esc(telVis)}</td>
          <td>${badgeRec}</td>
          <td style="display:flex;gap:8px;align-items:center;">
            <a class="btn-wa" href="${esc(urlWA)}" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
                <path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.116 1.522 5.847L.057 23.882l6.198-1.625A11.94 11.94 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.894c-1.967 0-3.797-.535-5.365-1.464l-.385-.228-3.993 1.047 1.065-3.888-.251-.399A9.86 9.86 0 012.106 12C2.106 6.533 6.533 2.106 12 2.106S21.894 6.533 21.894 12 17.467 21.894 12 21.894z"/>
              </svg>
              Recordar
            </a>
            <button class="btn-del" data-id="${c.id}" data-nombre="${esc(c.nombre)}" onclick="eliminarCita(this.dataset.id, this.dataset.nombre)">🗑 Eliminar</button>
          </td>
        </tr>`;
    }).join('');

    document.getElementById('tabla-contenido').innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Cliente</th><th>Servicio</th><th>Fecha</th>
            <th>Hora</th><th>Teléfono</th><th>Recordatorio auto</th><th>Acción</th>
          </tr>
        </thead>
        <tbody>${filas}</tbody>
      </table>`;
  }

  function formatHora(hora) {
    const [h, m] = hora.split(':').map(Number);
    const ampm   = h >= 12 ? 'PM' : 'AM';
    return `${h % 12 || 12}:${String(m).padStart(2,'0')} ${ampm}`;
  }

  async function eliminarCita(id, nombre) {
    if (!confirm(`¿Eliminar la cita de ${nombre}? Esta acción no se puede deshacer.`)) return;
    const resp = await fetch(`/api/admin-citas?id=${id}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (resp.ok) {
      cargarCitas(rangoActual);
      // Si el calendario está visible, refresca también
      if (vistaActual !== 'lista') cargarCitasCalendario();
    } else {
      alert('Error al eliminar la cita.');
    }
  }

  // ══════════════════════════════════════════════
  // CALENDARIO
  // ══════════════════════════════════════════════

  let vistaActual  = 'lista';
  let calMesRef    = new Date(TODAY + 'T12:00:00');
  let calSemRef    = new Date(TODAY + 'T12:00:00');
  let citasCalCache = [];

  const MESES     = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const DIAS      = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

  // ── Toggle de vista ──
  const btnVLista   = document.getElementById('btn-vista-lista');
  const btnVMes     = document.getElementById('btn-vista-cal-mes');
  const btnVSem     = document.getElementById('btn-vista-cal-sem');
  const btnVHorario = document.getElementById('btn-vista-horario');

  function setVista(v) {
    vistaActual = v;
    [btnVLista, btnVMes, btnVSem, btnVHorario].forEach(b => b.classList.remove('active'));
    ['vista-lista','vista-cal-mes','vista-cal-semana','vista-horario'].forEach(id => {
      document.getElementById(id).style.display = 'none';
    });
    document.getElementById('filtros-lista').style.visibility = v === 'lista' ? 'visible' : 'hidden';

    if (v === 'lista') {
      btnVLista.classList.add('active');
      document.getElementById('vista-lista').style.display = 'block';
    } else if (v === 'mes') {
      btnVMes.classList.add('active');
      document.getElementById('vista-cal-mes').style.display = 'block';
      cargarCitasCalendario().then(renderMes);
    } else if (v === 'semana') {
      btnVSem.classList.add('active');
      document.getElementById('vista-cal-semana').style.display = 'block';
      cargarCitasCalendario().then(renderSemana);
    } else if (v === 'horario') {
      btnVHorario.classList.add('active');
      document.getElementById('vista-horario').style.display = 'block';
      cargarDisponibilidad();
    }
  }

  btnVLista.addEventListener('click',   () => setVista('lista'));
  btnVMes.addEventListener('click',     () => setVista('mes'));
  btnVSem.addEventListener('click',     () => setVista('semana'));
  btnVHorario.addEventListener('click', () => setVista('horario'));

  // ── Cargar citas (3 meses) para calendario ──
  async function cargarCitasCalendario() {
    try {
      const r = await fetch('/api/admin-citas?rango=todas', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!r.ok) return;
      const d = await r.json();
      citasCalCache = d.citas || [];
    } catch {}
  }

  // ── Helpers ──
  function citasDeDate(d) {
    const key = d.toISOString().split('T')[0];
    return citasCalCache.filter(c => c.fecha === key);
  }

  function fmtHora(h) {
    const [hh, mm] = h.split(':').map(Number);
    return `${hh % 12 || 12}:${String(mm).padStart(2,'0')} ${hh >= 12 ? 'PM' : 'AM'}`;
  }

  // ── Vista MES ──
  document.getElementById('cal-mes-prev').addEventListener('click', () => {
    calMesRef.setMonth(calMesRef.getMonth() - 1);
    renderMes();
  });
  document.getElementById('cal-mes-next').addEventListener('click', () => {
    calMesRef.setMonth(calMesRef.getMonth() + 1);
    renderMes();
  });

  function renderMes() {
    const y = calMesRef.getFullYear();
    const m = calMesRef.getMonth();
    document.getElementById('cal-mes-titulo').textContent = `${MESES[m]} ${y}`;

    const primerDia   = new Date(y, m, 1).getDay();   // 0=Dom
    const diasEnMes   = new Date(y, m + 1, 0).getDate();
    const diasMesAnt  = new Date(y, m, 0).getDate();

    const grid = document.getElementById('cal-mes-grid');
    grid.innerHTML = '';

    // Celdas del mes anterior
    for (let i = primerDia - 1; i >= 0; i--) {
      const cell = document.createElement('div');
      cell.className = 'cal-cell otro-mes';
      cell.innerHTML = `<div class="cal-day-num">${diasMesAnt - i}</div>`;
      grid.appendChild(cell);
    }

    // Celdas del mes actual
    for (let d = 1; d <= diasEnMes; d++) {
      const fecha  = new Date(y, m, d);
      const citas  = citasDeDate(fecha);
      const esHoy  = fecha.toISOString().split('T')[0] === TODAY;
      const cell   = document.createElement('div');
      cell.className = 'cal-cell' + (esHoy ? ' hoy' : '') + (citas.length ? ' tiene-citas' : '');

      let inner = `<div class="cal-day-num">${d}</div>`;
      if (citas.length <= 2) {
        citas.forEach(c => {
          inner += `<span class="cal-cita-chip">${fmtHora(c.hora)} ${esc(c.nombre.split(' ')[0])}</span>`;
        });
      } else {
        inner += `<span class="cal-cita-chip">${citas.length} citas</span>`;
      }
      cell.innerHTML = inner;

      if (citas.length) {
        cell.addEventListener('click', () => abrirModalDia(fecha, citas));
      }
      grid.appendChild(cell);
    }

    // Celdas del mes siguiente para completar la grilla
    const totalCeldas = primerDia + diasEnMes;
    const restantes   = totalCeldas % 7 === 0 ? 0 : 7 - (totalCeldas % 7);
    for (let i = 1; i <= restantes; i++) {
      const cell = document.createElement('div');
      cell.className = 'cal-cell otro-mes';
      cell.innerHTML = `<div class="cal-day-num">${i}</div>`;
      grid.appendChild(cell);
    }
  }

  // ── Vista SEMANA ──
  document.getElementById('cal-sem-prev').addEventListener('click', () => {
    calSemRef.setDate(calSemRef.getDate() - 7);
    renderSemana();
  });
  document.getElementById('cal-sem-next').addEventListener('click', () => {
    calSemRef.setDate(calSemRef.getDate() + 7);
    renderSemana();
  });

  function renderSemana() {
    // Calcular inicio de semana (domingo)
    const dow   = calSemRef.getDay();
    const inicio = new Date(calSemRef);
    inicio.setDate(calSemRef.getDate() - dow);

    const fin = new Date(inicio);
    fin.setDate(inicio.getDate() + 6);

    const fmtCorto = d => `${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`;
    document.getElementById('cal-sem-titulo').textContent =
      `${fmtCorto(inicio)} – ${fmtCorto(fin)} ${fin.getFullYear()}`;

    const grid = document.getElementById('cal-sem-grid');
    grid.innerHTML = '';

    for (let i = 0; i < 7; i++) {
      const dia   = new Date(inicio);
      dia.setDate(inicio.getDate() + i);
      const citas = citasDeDate(dia);
      const esHoy = dia.toISOString().split('T')[0] === TODAY;

      const dateNumHTML = esHoy
        ? `<div class="cal-semana-date hoy-date">${dia.getDate()}</div>`
        : `<div class="cal-semana-date">${dia.getDate()}</div>`;

      let citasHTML = '';
      if (citas.length) {
        citas.sort((a,b) => a.hora.localeCompare(b.hora));
        citas.forEach(c => {
          citasHTML += `
            <div class="cal-semana-cita" onclick='abrirModalDia(new Date("${dia.toISOString().split('T')[0]}T12:00:00"), ${JSON.stringify(citas).replace(/'/g,"&#39;")})'>
              <div class="cal-semana-cita-hora">${fmtHora(c.hora)}</div>
              <div class="cal-semana-cita-nombre">${esc(c.nombre)}</div>
              <div class="cal-semana-cita-svc">${esc(c.servicio.split('—')[0].trim())}</div>
            </div>`;
        });
      } else {
        citasHTML = '<div class="cal-semana-empty">—</div>';
      }

      const col = document.createElement('div');
      col.className = 'cal-semana-col';
      col.innerHTML = `
        <div class="cal-semana-col-header">
          <div class="cal-semana-dow">${DIAS[i].slice(0,3)}</div>
          ${dateNumHTML}
        </div>
        <div class="cal-semana-citas">${citasHTML}</div>`;
      grid.appendChild(col);
    }
  }

  // ── Modal detalle día ──
  function abrirModalDia(fecha, citas) {
    const titulo = fecha.toLocaleDateString('es-CR', { weekday:'long', day:'numeric', month:'long' });
    document.getElementById('modal-dia-titulo').textContent = titulo;

    citas.sort((a,b) => a.hora.localeCompare(b.hora));
    document.getElementById('modal-dia-citas').innerHTML = citas.map(c => `
      <div class="modal-cita">
        <div class="modal-cita-hora">${fmtHora(c.hora)}</div>
        <div class="modal-cita-nombre">${esc(c.nombre)}</div>
        <div class="modal-cita-svc">${esc(c.servicio)}</div>
        <div class="modal-cita-tel">📱 ${esc(c.telefono.startsWith('506') ? c.telefono.slice(3) : c.telefono)}</div>
      </div>`).join('');

    document.getElementById('modal-dia').classList.add('open');
  }

  // Cerrar modal al click en overlay
  document.getElementById('modal-dia').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('open');
  });

  // ══════════════════════════════════════════════
  // DISPONIBILIDAD — Horario semanal + días bloqueados
  // ══════════════════════════════════════════════

  let horarioLocal    = [];
  let bloqueadosLocal = [];

  async function cargarDisponibilidad() {
    document.getElementById('horario-rows').innerHTML    = '<div class="disp-empty">Cargando…</div>';
    document.getElementById('bloqueados-lista').innerHTML = '<div class="disp-empty">Cargando…</div>';

    const [{ data: horarios }, { data: bloqueados }] = await Promise.all([
      sb.from('horarios').select('*').order('dia_semana'),
      sb.from('dias_bloqueados').select('*').order('fecha')
    ]);

    horarioLocal    = horarios    || [];
    bloqueadosLocal = bloqueados  || [];

    renderHorario();
    renderBloqueados();
  }

  function renderHorario() {
    const container = document.getElementById('horario-rows');
    if (!horarioLocal.length) {
      container.innerHTML = '<div class="disp-empty">No se encontró la tabla de horarios. Ejecutá el SQL de configuración en Supabase.</div>';
      return;
    }
    container.innerHTML = horarioLocal.map(h => `
      <div class="horario-row">
        <span class="horario-dia">${DIAS[h.dia_semana]}</span>
        <input type="checkbox" class="horario-toggle" data-dia="${h.dia_semana}"
               ${h.activo ? 'checked' : ''}
               onchange="toggleHorarioDia(${h.dia_semana}, this.checked)"/>
        <span class="horario-estado" id="hest-${h.dia_semana}">${h.activo ? 'Abierto' : 'Cerrado'}</span>
        <span class="horario-time-label">Desde</span>
        <input type="time" class="horario-time" data-dia="${h.dia_semana}" data-campo="inicio"
               value="${h.hora_inicio}" ${!h.activo ? 'disabled' : ''}
               onchange="updateHorario(${h.dia_semana}, 'inicio', this.value)"/>
        <span class="horario-time-label">Hasta</span>
        <input type="time" class="horario-time" data-dia="${h.dia_semana}" data-campo="fin"
               value="${h.hora_fin}" ${!h.activo ? 'disabled' : ''}
               onchange="updateHorario(${h.dia_semana}, 'fin', this.value)"/>
      </div>`).join('');
  }

  function toggleHorarioDia(dia, activo) {
    const h = horarioLocal.find(x => x.dia_semana === dia);
    if (h) h.activo = activo;
    document.querySelectorAll(`.horario-time[data-dia="${dia}"]`)
      .forEach(el => el.disabled = !activo);
    const est = document.getElementById(`hest-${dia}`);
    if (est) est.textContent = activo ? 'Abierto' : 'Cerrado';
  }

  function updateHorario(dia, campo, valor) {
    const h = horarioLocal.find(x => x.dia_semana === dia);
    if (h) h[campo === 'inicio' ? 'hora_inicio' : 'hora_fin'] = valor;
  }

  document.getElementById('btn-save-horario').addEventListener('click', async () => {
    const btn = document.getElementById('btn-save-horario');
    const msg = document.getElementById('save-msg');
    btn.disabled = true;
    btn.textContent = 'Guardando…';
    msg.textContent = '';
    msg.style.color = 'var(--green)';

    try {
      for (const h of horarioLocal) {
        const { error } = await sb.from('horarios').update({
          activo:      h.activo,
          hora_inicio: h.hora_inicio,
          hora_fin:    h.hora_fin,
          updated_at:  new Date().toISOString()
        }).eq('dia_semana', h.dia_semana);
        if (error) throw error;
      }
      msg.textContent = '✓ Guardado';
      setTimeout(() => { msg.textContent = ''; }, 3000);
    } catch (e) {
      msg.style.color = 'var(--red)';
      msg.textContent = 'Error al guardar';
      console.error(e);
    }

    btn.disabled = false;
    btn.textContent = '💾 Guardar cambios';
  });

  function renderBloqueados() {
    const container = document.getElementById('bloqueados-lista');
    if (!bloqueadosLocal.length) {
      container.innerHTML = '<div class="disp-empty">No hay días bloqueados.</div>';
      return;
    }
    container.innerHTML = bloqueadosLocal.map(b => {
      const fechaFmt = new Date(b.fecha + 'T12:00:00').toLocaleDateString('es-CR', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
      return `
        <div class="bloqueo-item">
          <div>
            <span class="bloqueo-fecha">${b.fecha}</span>
            ${b.motivo ? `<span class="bloqueo-motivo">— ${esc(b.motivo)}</span>` : ''}
            <div style="font-size:.77rem;color:var(--gray);margin-top:2px;text-transform:capitalize;">${fechaFmt}</div>
          </div>
          <button class="btn-rm-bloqueo" onclick="eliminarBloqueo('${b.id}', '${b.fecha}')">✕ Quitar</button>
        </div>`;
    }).join('');
  }

  document.getElementById('btn-add-bloqueo').addEventListener('click', async () => {
    const fecha  = document.getElementById('inp-blq-fecha').value;
    const motivo = document.getElementById('inp-blq-motivo').value.trim();

    if (!fecha) { alert('Seleccioná una fecha para bloquear.'); return; }

    const { error } = await sb.from('dias_bloqueados').insert([{ fecha, motivo }]);
    if (error) {
      if (error.code === '23505') alert('Esa fecha ya está bloqueada.');
      else { alert('Error al guardar.'); console.error(error); }
      return;
    }

    document.getElementById('inp-blq-fecha').value  = '';
    document.getElementById('inp-blq-motivo').value = '';
    cargarDisponibilidad();
  });

  async function eliminarBloqueo(id, fecha) {
    if (!confirm(`¿Quitar el bloqueo del ${fecha}?`)) return;
    const { error } = await sb.from('dias_bloqueados').delete().eq('id', id);
    if (error) { alert('Error al eliminar.'); return; }
    cargarDisponibilidad();
  }
</script>
</body>
</html>
